name: Optimize resource pack
on: [push]
permissions:
  contents: write
jobs:
  packsquash:
    name: Optimize resource pack
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # A non-shallow repository clone is required
      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4.0.4
        with:
          packsquash_version: latest
          options: |
            # Optimize the pack in the root repository directory.
            # This is the default value for pack_directory when no PackSquash options are defined
            pack_directory = 'main'

            # Set a custom output file path to work with the generated ZIP file
            # without needing to download its artifact in a separate step
            output_file_path = '/tmp/pack.zip'

            # 'pedantic' produces fully spec-conformant ZIP files that any client can open.
            # Previously this was set to 'disregard' (+ size_increasing_zip_obfuscation) as a
            # light anti-extraction measure, but PackSquash's own docs note that non-conformant
            # ZIPs are handled inconsistently across Minecraft clients/Java versions, which was
            # causing packs to fail to apply for some players (ZipException: Invalid CEN header).
            zip_spec_conformance_level = 'pedantic'
      - name: Compute pack hash
        id: pack_hash
        run: echo "sha1=$(sha1sum /tmp/pack.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Tag and create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: /tmp/pack.zip
          body: |
            SHA1: `${{ steps.pack_hash.outputs.sha1 }}`

            Set this as `resource-pack-sha1` in server.properties.
